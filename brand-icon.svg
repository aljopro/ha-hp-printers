    <rect x="66" y="8" width="124" height="74" rx="6" fill="#FFFFFF" stroke="#2F3A46" stroke-width="10"/>
    <rect x="86"  y="30" width="16" height="34" rx="3" fill="#00A6DE"/>
    <rect x="110" y="30" width="16" height="34" rx="3" fill="#E5007D"/>
    <rect x="134" y="30" width="16" height="34" rx="3" fill="#FFC800"/>
    <rect x="158" y="30" width="16" height="34" rx="3" fill="#2F3A46"/>
  </g>
  <!-- Printer body -->
  <rect x="20" y="86" width="216" height="108" rx="20" fill="#2F3A46"/>
  <!-- Output slot -->
  <rect x="52" y="112" width="152" height="14" rx="7" fill="#FFFFFF" opacity="0.92"/>
  <!-- Status lamp -->
  <circle cx="196" cy="160" r="11" fill="#4FD675"/>
  <!-- Feet -->
  <rect x="46"  y="200" width="40" height="18" rx="9" fill="#2F3A46"/>
  <rect x="170" y="200" width="40" height="18" rx="9" fill="#2F3A46"/>
