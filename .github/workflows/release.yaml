# Releases on merge to main, using Home Assistant's calendar versioning:
# YEAR.MONTH.RELEASE, where RELEASE counts from 0 within each month --
# 2026.8.0, 2026.8.1, then 2026.9.0 when the month turns over.
#
# The version is computed here rather than edited by hand, because a
# calendar version is derivable: the date plus how many releases this month
# already has. The job writes it into manifest.json, commits, tags and
# publishes.
#
# A release is cut only when something under custom_components/ changed
# since the last release. Documentation, CI and test-only commits ship
# nothing to a user, so they do not get a version.
#
# It runs after CI rather than on push, so a red commit is never released.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The exact commit CI passed on, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history and tags: the job diffs against the last release.
          fetch-depth: 0

      - name: Decide whether there is anything to release
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          echo "last=$last" >> "$GITHUB_OUTPUT"
          if [ -z "$last" ]; then
            echo "No previous release; releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$last" HEAD -- custom_components/; then
            echo "No integration changes since $last; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Integration changed since $last; releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute the calendar version
        id: version
        if: steps.changed.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month=$(date -u +%Y.%-m)
          # Consider tags as well as releases. Deleting a release leaves its
          # tag behind, and reusing that number would attach the new release
          # to the old tag's commit rather than this one.
          highest=$(
            {
              gh release list --limit 100 --json tagName --jq '.[].tagName'
              git tag --list "v${month}.*"
            } \
              | grep "^v${month}\." \
              | sed "s/^v${month}\.//" \
              | grep -E '^[0-9]+$' \
              | sort -n | tail -1
          )
          next=$(( ${highest:--1} + 1 ))
          version="${month}.${next}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Next version: $version"

      - name: Refuse to reuse an existing tag
        if: steps.changed.outputs.release == 'true'
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists as a tag. Computing it again"\
              " means the version arithmetic and the tags disagree."
            exit 1
          fi

      - name: Write the version into the manifest
        if: steps.changed.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("custom_components/hp_printers/manifest.json")
          manifest = json.loads(path.read_text())
          manifest["version"] = os.environ["VERSION"]
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Commit, tag and publish
        if: steps.changed.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          LAST: ${{ steps.changed.outputs.last }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/hp_printers/manifest.json
          # The manifest may already carry this version -- someone can set it
          # by hand, and the first calendar release did. Committing nothing
          # is an error, so only commit when there is a change.
          if git diff --cached --quiet; then
            echo "Manifest already reads $VERSION; tagging as-is."
          else
            # [skip ci] keeps this commit from starting another CI run,
            # which would trigger this workflow again.
            git commit -m "Release $VERSION [skip ci]"
            git push origin HEAD:main
          fi
          # Notes are built from commit subjects, not from --generate-notes.
          # That builds its list out of merged pull requests, and this
          # repository commits straight to main, so it produces nothing but a
          # changelog link.
          # A release whose tag was deleted still shows up in the release
          # list, so the tag is verified rather than assumed -- otherwise
          # git log fails the step after the manifest has been committed.
          last="${LAST}"
          if [ -n "$last" ] && git rev-parse -q --verify "refs/tags/$last" >/dev/null; then
            range="$last..HEAD"
          else
            last=""
            range="HEAD"
          fi
          {
            git log --no-merges --pretty=format:'- %s' "$range"
            echo
            if [ -n "$last" ]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${last}...v${VERSION}"
            fi
          } > /tmp/release-notes.md
          cat /tmp/release-notes.md
          gh release create "v$VERSION" \
            --target "$(git rev-parse HEAD)" \
            --title "v$VERSION" \
            --notes-file /tmp/release-notes.md
